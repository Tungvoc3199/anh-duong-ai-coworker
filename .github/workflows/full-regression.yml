name: Full Regression

on:
  push:
    branches:
      - fix/agent-final-response-resilience

permissions:
  contents: read

concurrency:
  group: final-response-resilience
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Recreate read-only ADE ownership fixture
        run: |
          sudo mkdir -p /mnt/f/AIOS/anh-duong-checkpoints/ADE-OS-backup-20260806T174329Z/.github/hooks
          printf 'fixture\n' | sudo tee /mnt/f/AIOS/anh-duong-checkpoints/ADE-OS-backup-20260806T174329Z/.github/hooks/audit.json >/dev/null

      - name: Full Python behavioral regression
        run: pytest -q

      - name: Scoped Ruff for final-response repair
        run: |
          ruff check \
            app/openclaw/models.py \
            app/openclaw/executor.py \
            tests/unit/test_openclaw_executor.py \
            tests/unit/test_openclaw_result_redaction.py \
            tests/unit/test_openclaw_result_variants.py

      - name: Scoped mypy for final-response repair
        run: mypy app/openclaw/models.py app/openclaw/executor.py

      - name: App compileall
        run: python -m compileall -q app

      - name: Repository-wide Ruff baseline diagnostic
        continue-on-error: true
        run: ruff check app scripts tests

      - name: Repository-wide mypy baseline diagnostic
        continue-on-error: true
        run: mypy app scripts

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Full OpenClaw plugin regression
        working-directory: integrations/openclaw-anh-duong-core
        run: npm test
